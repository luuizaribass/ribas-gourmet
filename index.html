<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#2a1210">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ribas">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Ribas Gourmet</title>
<style>
:root{
  --bg:#2a1210; --card:#4a2219; --card2:#3a1a14; --nav:#1f0d0b;
  --pink:#d9246f; --pink2:#f5a9c8; --yellow:#f2c14e; --cream:#fde9de; --orange:#f59e42;
  --green:#5fd39a; --red:#ff6b6b; --muted:#c9a89a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none !important}
html,body{margin:0;background:var(--bg);color:var(--cream);
  font-family:ui-rounded,-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;font-size:16px}
body{min-height:100dvh;padding-top:env(safe-area-inset-top);-webkit-text-size-adjust:100%}
body.lock{overflow:hidden}
button,input,select{font:inherit;color:inherit}
#app{max-width:560px;margin:0 auto;padding:8px 16px calc(150px + env(safe-area-inset-bottom))}

/* cabeçalho */
.top{text-align:center;margin-bottom:10px;position:relative}
.logo{display:inline-flex;flex-direction:column;align-items:center;background:var(--cream);color:var(--pink);
  padding:6px 22px 8px;border-radius:0 0 18px 18px;line-height:1}
.logo i{font-family:'Snell Roundhand','Savoye LET','Brush Script MT',cursive;font-size:26px;font-weight:700}
.logo small{color:var(--bg);font-weight:800;letter-spacing:.14em;font-size:10px;margin-top:1px}
.cloud{position:absolute;right:0;top:8px;border:0;background:var(--card);color:var(--muted);font-size:12px;font-weight:700;padding:6px 10px;border-radius:99px}
.cloud.ok{color:var(--green)} .cloud.pend{color:var(--yellow)} .cloud.err{color:var(--red)}
h1{font-family:'Snell Roundhand','Savoye LET','Brush Script MT',cursive;color:var(--yellow);
  font-size:44px;margin:6px 0 0;font-weight:700;line-height:1.05}
h2{margin:0 0 12px;font-size:20px;color:var(--yellow)}
h3{margin:0;font-size:17px}
.sub{color:var(--pink2);font-size:13px;margin:2px 0 0}
.muted{color:var(--muted);font-size:13px}
.back{background:none;border:0;color:var(--pink2);font-size:16px;padding:6px 0;margin-bottom:2px}

/* cards e botões */
.card{background:var(--card);border-radius:18px;padding:14px;margin:10px 0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.stat{background:var(--card);border-radius:16px;padding:10px 8px;text-align:center}
.stat b{display:block;font-size:19px;color:var(--yellow)}
.stat span{font-size:11px;color:var(--muted)}
.stat.warn b{color:var(--orange)}
.hero{background:var(--pink);border-radius:20px;padding:16px;margin:10px 0}
.hero span{font-size:13px;opacity:.9}
.hero b{display:block;font-size:30px;margin-top:2px}
.btn{border:0;border-radius:14px;padding:13px 16px;background:var(--card);font-weight:700;cursor:pointer}
.btn.wide{display:block;width:100%;margin-top:10px;text-align:center;text-decoration:none}
.card .btn:not(.primary):not(.yellow):not(.danger):not(.small){background:var(--card2);border:1.5px solid #5b3329}
.btn.primary{background:var(--pink);color:#fff}
.btn.yellow{background:var(--yellow);color:var(--bg)}
.btn.danger{background:transparent;border:1.5px solid var(--red);color:var(--red)}
.btn.small{padding:8px 12px;font-size:14px;border-radius:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{background:var(--yellow);color:var(--bg);font-weight:800;font-size:13px;padding:3px 10px;border-radius:99px}
.chip.dim{background:transparent;border:1px dashed var(--muted);color:var(--muted);font-weight:600}
.chip.pink{background:var(--pink);color:#fff}
.chip.red{background:var(--red);color:var(--bg)}
.chip.orange{background:var(--orange);color:var(--bg)}
.chip.green{background:var(--green);color:var(--bg)}

/* produto / estoque */
.prod{display:flex;align-items:center;gap:10px;justify-content:space-between}
.pinfo{flex:1;min-width:0}
.stockcol{display:flex;flex-direction:column;align-items:center;gap:6px}
.round{width:36px;height:36px;border-radius:50%;border:0;background:var(--pink);color:#fff;font-size:22px;font-weight:700;line-height:1;cursor:pointer}
.round.off{background:var(--card2);color:var(--muted)}
.num{min-width:64px;height:44px;border:0;border-radius:12px;background:var(--card2);font-size:22px;font-weight:800;color:var(--cream)}
.num.low{color:var(--orange)} .num.zero{color:var(--red)}

/* vender */
.sale{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sale.on{outline:2px solid var(--yellow)}
.step{display:flex;align-items:center;gap:8px}
.step b{min-width:22px;text-align:center;font-size:18px}
.cartbar{position:fixed;left:12px;right:12px;bottom:calc(66px + env(safe-area-inset-bottom));max-width:536px;margin:0 auto;
  background:var(--yellow);color:var(--bg);border-radius:18px;padding:10px 12px 10px 16px;display:flex;align-items:center;justify-content:space-between;
  box-shadow:0 6px 24px rgba(0,0,0,.45);z-index:20}
.cartbar b{font-size:20px}
.cartbar small{display:block;font-weight:600;opacity:.8}
.cartbar button{background:var(--bg);color:var(--yellow);border:0;border-radius:12px;padding:11px 16px;font-weight:800}

/* navegação */
nav{position:fixed;left:0;right:0;bottom:0;background:var(--nav);display:flex;
  padding:6px 4px calc(6px + env(safe-area-inset-bottom));border-top:1px solid #3d2019;z-index:30}
nav button{flex:1;background:none;border:0;color:var(--muted);font-size:11px;font-weight:700;padding:4px 0;position:relative}
nav button span{display:block;font-size:22px;line-height:1.2;filter:grayscale(.6);opacity:.8}
nav button.on{color:var(--yellow)} nav button.on span{filter:none;opacity:1}
nav em{position:absolute;top:0;right:22%;background:var(--pink);color:#fff;font-style:normal;font-size:11px;font-weight:800;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 4px}

/* sheet */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:flex;align-items:flex-end}
.ov[hidden]{display:none}
.sheet{background:var(--bg);border-radius:24px 24px 0 0;width:100%;max-width:560px;margin:0 auto;max-height:92dvh;overflow:auto;
  padding:8px 18px calc(24px + env(safe-area-inset-bottom));border-top:3px solid var(--pink)}
.grab{width:44px;height:5px;border-radius:3px;background:#5b3329;margin:6px auto 14px}
label{display:block;font-size:13px;color:var(--pink2);margin:10px 0 0;font-weight:700}
input,select{display:block;width:100%;margin-top:5px;background:var(--card);border:1.5px solid #5b3329;border-radius:12px;padding:12px;font-size:16px;color:var(--cream)}
input:focus,select:focus{outline:none;border-color:var(--yellow)}
input{min-height:48px}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.row2>*{min-width:0}
.row2.dq{grid-template-columns:minmax(0,1.7fr) minmax(0,1fr)}
input[type=date]{-webkit-appearance:none;appearance:none;min-width:0;max-width:100%;width:100%;text-align:left;display:block;line-height:1.2}
input[type=date]::-webkit-date-and-time-value{text-align:left;margin:0}
.seg{display:flex;gap:8px;margin-top:10px}
.seg button{flex:1;border:1.5px solid #5b3329;background:var(--card);border-radius:12px;padding:11px 4px;font-weight:700;font-size:15px}
.seg button.on{background:var(--yellow);color:var(--bg);border-color:var(--yellow)}
.totalrow{display:flex;justify-content:space-between;align-items:baseline;margin-top:16px;font-size:16px}
.totalrow b{font-size:28px;color:var(--yellow)}
.troco{margin-top:8px;color:var(--green);font-weight:700}

/* listas */
.line{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:9px 0;border-bottom:1px dashed #5b3329}
.line:last-child{border-bottom:0}
.line .l{min-width:0}
.line .r{text-align:right;white-space:nowrap}
.pill{display:inline-block;font-size:12px;font-weight:800;padding:2px 9px;border-radius:99px}
.pill.pend{background:var(--orange);color:var(--bg)}
.pill.paid{background:var(--green);color:var(--bg)}
.bar{height:8px;background:var(--card2);border-radius:5px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--pink);border-radius:5px}
.chipsrow{display:flex;gap:8px;overflow-x:auto;margin:10px 0}
.chipsrow button{flex:0 0 auto;border:0;background:var(--card);border-radius:99px;padding:8px 14px;font-weight:700;font-size:14px}
.chipsrow button.on{background:var(--pink);color:#fff}
.menu{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;cursor:pointer}
.menu span.ic{font-size:26px}
.ntext{display:block;width:100%;min-height:55vh;margin-top:8px;background:var(--card);border:1.5px solid #5b3329;border-radius:14px;padding:14px;font-size:17px;line-height:1.45;color:var(--cream);resize:none}
.noteh{display:flex;gap:8px;justify-content:flex-end;margin:4px 0}.noteh .btn{width:auto}
#menulist .menu{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;position:relative;transition:box-shadow .15s}
.menu .grip{margin-left:auto;color:var(--muted);font-size:20px;opacity:.6}
.menu.dragging{z-index:5;box-shadow:0 10px 28px rgba(0,0,0,.55);outline:2px solid var(--pink);transition:none}
.menu small{display:block;color:var(--muted);font-weight:500}
.empty{text-align:center;color:var(--muted);padding:26px 10px}
.gh{display:flex;justify-content:space-between;align-items:baseline;width:100%;background:none;border:0;color:var(--yellow);font-weight:800;font-size:18px;padding:16px 4px 4px;text-align:left;cursor:pointer}
.gh small{color:var(--muted);font-weight:600;font-size:12px}
.card.tight{padding:10px 12px;margin:6px 0}
.card.tight h3{font-size:16px}
.search{margin:8px 0 2px;border-radius:99px;padding:12px 16px}
.cartcard{border:2px solid var(--yellow)}
.cartcard .tot{display:flex;justify-content:space-between;align-items:baseline;margin-top:8px;padding-top:8px;border-top:2px solid #5b3329}
.cartcard .tot b{font-size:24px;color:var(--yellow)}
.ios{background:#000;border-radius:26px;padding:10px 12px 16px;margin-top:8px;user-select:none;-webkit-user-select:none}
.ios .disp{color:#fff;text-align:right;font-weight:300;line-height:1.15;min-height:96px;padding:18px 8px 6px;overflow:hidden;white-space:nowrap;display:flex;align-items:flex-end;justify-content:flex-end;font-family:-apple-system,"SF Pro Display",system-ui,sans-serif;font-variant-numeric:tabular-nums}
.ios .keys{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.ios .k{aspect-ratio:1;border-radius:50%;border:0;font-size:30px;font-weight:400;color:#fff;background:#333;padding:0;font-family:-apple-system,"SF Pro Display",system-ui,sans-serif}
.ios .k:active{filter:brightness(1.5)}
.ios .k.f{background:#a5a5a5;color:#000}
.ios .k.o{background:#ff9f0a;color:#fff;font-size:38px}
.ios .k.o.on{background:#fff;color:#ff9f0a}
.ios .k.z{grid-column:span 2;aspect-ratio:auto;border-radius:99px;text-align:left;padding-left:8%}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}
.banner{background:#5a2a14;border:1px solid var(--orange);color:var(--cream);border-radius:14px;padding:10px 12px;font-size:13px;margin:8px 0}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translateX(-50%);background:var(--cream);color:var(--bg);
  padding:10px 18px;border-radius:99px;font-weight:700;z-index:99;box-shadow:0 4px 18px rgba(0,0,0,.5);max-width:90%;text-align:center}
</style>
<script src="config.js"></script>
</head>
<body>
<div id="app"></div>
<div id="cartbar"></div>
<nav>
  <button data-a="tab" data-v="vender"><span>🛍️</span>Vender</button>
  <button data-a="tab" data-v="pend"><span>⏳</span>Pendentes<em id="pbadge" hidden></em></button>
  <button data-a="tab" data-v="estoque"><span>🍫</span>Estoque</button>
  <button data-a="tab" data-v="lucro"><span>📈</span>Lucro</button>
  <button data-a="tab" data-v="fin"><span>📒</span>Extrato</button>
  <button data-a="tab" data-v="mais"><span>⚙️</span>Mais</button>
</nav>
<div class="ov" id="ov" hidden><div class="sheet" id="sh"></div></div>
<input type="file" id="imp" accept="application/json,.json" hidden>

<script>
'use strict';
/* ============ utilidades ============ */
const KEY = 'ribas_gourmet_v1';
const $ = s => document.querySelector(s);
const brl = n => (Number(n) || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const num = v => { const n = parseFloat(String(v == null ? '' : v).replace(',', '.')); return isFinite(n) ? n : 0; };
const int = v => Math.round(num(v));
const pad = n => String(n).padStart(2, '0');
const dkey = d => { d = new Date(d); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
const fmtDate = iso => { const d = new Date(iso); return pad(d.getDate()) + '/' + pad(d.getMonth() + 1) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const fmtD = ymd => String(ymd).split('-').reverse().join('/');
const short = n => n.replace(/^Trufa /, '');
const lucroTxt = (c, p) => (c > 0 && p > 0) ? brl(p - c) + ' (' + Math.round((p - c) / p * 100) + '%)' : '—';

/* ============ dados ============ */
const LINE_INFO = {
  'Tabletinho 5g': 'R$2,00 · 3 por R$5,00 (pode misturar sabores)',
  'Trufa Bless': 'Zero adição de açúcar e zero lactose'
};
function defaults() {
  const out = [];
  const L = (line, price, items, extra) => items.forEach(([flavor, cost]) => out.push(Object.assign(
    { id: uid(), line, flavor, name: line + ' ' + flavor, price, cost, stock: 0, min: 3, promoQty: 0, promoPrice: 0, promoGroup: '' }, extra || {})));
  L('Tabletinho 5g', 2, [['Ao leite', 1.12], ['Branca', 1.12], ['Café', 1.12], ['Menta', 1.12], ['55%', 1.12], ['70%', 1.12]], { promoQty: 3, promoPrice: 5, promoGroup: 'tabletinho' });
  L('Trufa Bless', 8.5, [['Ao leite', 5.6], ['Branca', 5.6], ['Morango', 5.6], ['Pistache', 6.39]]);
  L('Trufa Dreams', 8, [['Cereja ao licor', 6.49], ['Marula', 6.49], ['Petit Gâteau', 6.49]]);
  L('Trufa Mil-folhas', 7.5, [['Tradicional', 6.49], ['Avelã', 6.49]]);
  L('Trufa Lanut', 7.5, [['Avelã', 6.49], ['Pistache', 6.49]]);
  L('Trufa Lacreme', 5.5, [['Ao leite', 3.79], ['Branca', 3.79], ['Avelã', 3.79], ['70%', 3.79], ['Kids', 3.79], ['Pistache', 3.79]]);
  L('Trufa Tradicional', 6.5, [['Ao leite', 5.29], ['Branca', 5.29], ['Mezzo', 5.29]]);
  L('Trufa Variadas', 7, [['Torta de limão', 5.29], ['Maracujá', 5.29], ['Morango', 5.29], ['Coco', 5.29], ['55%', 5.29], ['Paçoca', 5.29], ['Menta', 5.29], ['Speculoos', 5.29]]);
  return { v: 5, products: out, customers: [], sales: [], stockLog: [], invests: [], notes: [], lastBackup: null };
}
function migrate(st) {
  if ((st.v || 0) < 3) {
    if (!(st.sales && st.sales.length) && !(st.stockLog && st.stockLog.length)) st.products = defaults().products;
    st.v = 3;
  }
  if (st.v < 4) {
    st.products.forEach(p => { if (p.line === 'Trufa Dreams' && p.flavor === 'Petit Gâteau' && p.price === 7.5) p.price = 8; });
    st.v = 4;
  }
  if (st.v < 5) {
    const C = { 'Trufa Dreams|Petit Gâteau': 6.49, 'Trufa Lacreme|Kids': 3.79, 'Trufa Lacreme|Pistache': 3.79, 'Trufa Tradicional|Ao leite': 5.29, 'Trufa Tradicional|Branca': 5.29, 'Trufa Variadas|Paçoca': 5.29, 'Trufa Variadas|Menta': 5.29, 'Trufa Variadas|Speculoos': 5.29 };
    st.products.forEach(p => { const c = C[p.line + '|' + p.flavor]; if (c && !p.cost) p.cost = c; });
    st.v = 5;
  }
  if (!Array.isArray(st.invests)) st.invests = [];
  if (!Array.isArray(st.notes)) st.notes = [];
  return st;
}
function load() {
  try {
    const r = localStorage.getItem(KEY);
    if (r) { const d = JSON.parse(r); if (d && Array.isArray(d.products)) return migrate(Object.assign(defaults(), d)); }
  } catch (e) {}
  return defaults();
}
let S = load();
function persistLocal() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); }
  catch (e) { toast('⚠️ Não consegui salvar no celular. Faça um backup!'); }
}
persistLocal();
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}

const prod = id => S.products.find(p => p.id === id);
const cust = id => S.customers.find(c => c.id === id);
function lineTotal(p, q) {
  if (p.promoQty > 0 && p.promoPrice > 0) return Math.floor(q / p.promoQty) * p.promoPrice + (q % p.promoQty) * p.price;
  return q * p.price;
}
const r2 = n => Math.round(n * 100) / 100;
// itens do carrinho com o total de cada um (a promoção do tabletinho soma todos os sabores)
function cartLines() {
  const lines = Object.entries(cart).filter(([id]) => prod(id)).map(([id, q]) => ({ p: prod(id), q, total: 0 }));
  const gr = {};
  lines.forEach(l => {
    if (l.p.promoQty > 0 && l.p.promoPrice > 0 && l.p.promoGroup) (gr[l.p.promoGroup] = gr[l.p.promoGroup] || []).push(l);
    else l.total = r2(lineTotal(l.p, l.q));
  });
  Object.values(gr).forEach(ls => {
    const p0 = ls[0].p, Q = ls.reduce((a, l) => a + l.q, 0);
    const tot = Math.floor(Q / p0.promoQty) * p0.promoPrice + (Q % p0.promoQty) * p0.price;
    let rem = r2(tot);
    ls.forEach((l, i) => { const sh = i === ls.length - 1 ? rem : r2(tot * l.q / Q); l.total = sh; rem = r2(rem - sh); });
  });
  return lines;
}
function groups() {
  const m = new Map();
  S.products.forEach(p => { const k = p.line || p.name; if (!m.has(k)) m.set(k, []); m.get(k).push(p); });
  return [...m];
}
const flavorOf = p => p.flavor || p.name;
const itemsText = s => s.items.map(i => i.qty + '× ' + short(i.name)).join(', ');
let col = {};
const isOpen = k => !col[k];
const gh = (v, line, extra) => `<button class="gh" data-a="toggle" data-k="${esc(v + ':' + line)}"><span>${isOpen(v + ':' + line) ? '▾' : '▸'} ${esc(line)}</span><small>${extra || ''}</small></button>`;

/* ============ banco de dados na nuvem (Supabase) ============ */
const META_KEY = 'ribas_meta_v1';
let META = (() => { try { return JSON.parse(localStorage.getItem(META_KEY)) || {}; } catch (e) { return {}; } })();
const metaSave = () => { try { localStorage.setItem(META_KEY, JSON.stringify(META)); } catch (e) {} };
let CFG = {}, cloudOn = false, BASE = '';
function applyCfg() {
  const c = window.RIBAS_CONFIG || {};
  CFG = { url: (c.url || META.cfgUrl || '').trim(), key: (c.key || META.cfgKey || '').trim() };
  cloudOn = !!(CFG.url && CFG.key);
  BASE = cloudOn ? CFG.url.replace(/\/+$/, '') : '';
}
applyCfg();
let syncing = false, syncTimer = null, syncErr = '';

function save() {
  S.updatedAt = new Date().toISOString();
  persistLocal();
  META.dirty = true; metaSave();
  updatePill(); scheduleSync();
}
const autoOn = () => META.auto === true;
function scheduleSync() {
  if (!cloudOn || !META.uid || !autoOn()) return;
  clearTimeout(syncTimer); syncTimer = setTimeout(() => syncNow(), 1500);
}
function pillParts() {
  if (!cloudOn) return ['', '☁️ ligar'];
  if (!META.uid) return ['', '☁️ entrar'];
  if (syncErr) return ['err', '☁️ erro'];
  if (!autoOn()) return META.dirty ? ['pend', '☁️ não salvo'] : ['ok', '☁️ salvo'];
  if (META.dirty) return ['pend', navigator.onLine === false ? '☁️ sem net' : '☁️ enviando…'];
  return ['ok', '☁️ salvo'];
}
function updatePill() {
  const [c, t] = pillParts();
  document.querySelectorAll('.cloud').forEach(b => { b.className = 'cloud ' + c; b.textContent = t; });
}
function setSession(j) {
  META.access = j.access_token; META.refresh = j.refresh_token;
  META.exp = Date.now() + (j.expires_in || 3600) * 1000;
  if (j.user) { META.uid = j.user.id; META.email = j.user.email; }
  metaSave();
}
async function authPost(grant, body) {
  const r = await fetch(BASE + '/auth/v1/token?grant_type=' + grant, { method: 'POST', headers: { apikey: CFG.key, 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  let j = {}; try { j = await r.json(); } catch (e) {}
  return { ok: r.ok, status: r.status, j };
}
async function login(email, pass) {
  const r = await authPost('password', { email, password: pass });
  if (!r.ok) throw new Error(r.j.error_description || r.j.msg || 'E-mail ou senha incorretos');
  setSession(r.j);
}
async function signup(email, pass) {
  const r = await fetch(BASE + '/auth/v1/signup', { method: 'POST', headers: { apikey: CFG.key, 'Content-Type': 'application/json' }, body: JSON.stringify({ email, password: pass }) });
  let j = {}; try { j = await r.json(); } catch (e) {}
  if (!r.ok) throw new Error(j.msg || j.error_description || j.message || 'Não consegui criar a conta');
  if (j.access_token) { setSession(j); return true; }
  return false;
}
async function token() {
  if (!META.access) throw new Error('Faça login');
  if (Date.now() > META.exp - 60000) {
    const r = await authPost('refresh_token', { refresh_token: META.refresh });
    if (!r.ok) {
      if (r.status === 400 || r.status === 401) { META.access = null; META.uid = null; metaSave(); }
      throw new Error('Sessão expirou. Entre de novo.');
    }
    setSession(r.j);
  }
  return META.access;
}
const hdr = async () => ({ apikey: CFG.key, Authorization: 'Bearer ' + await token(), 'Content-Type': 'application/json' });
async function remoteGet() {
  const r = await fetch(`${BASE}/rest/v1/app_state?select=data,updated_at&user_id=eq.${META.uid}`, { headers: await hdr() });
  if (!r.ok) throw new Error('Erro ao ler a nuvem (' + r.status + ')');
  const a = await r.json(); return a[0] || null;
}
async function remotePut() {
  const h = await hdr(); h.Prefer = 'resolution=merge-duplicates,return=minimal';
  const r = await fetch(`${BASE}/rest/v1/app_state?on_conflict=user_id`, { method: 'POST', headers: h, body: JSON.stringify({ user_id: META.uid, data: S, updated_at: S.updatedAt }) });
  if (!r.ok) throw new Error('Erro ao salvar na nuvem (' + r.status + ')');
}
const sameTime = (a, b) => !!a && !!b && Date.parse(a) === Date.parse(b);
const dataInfo = d => ((d.sales || []).length) + ' vendas · ' + ((d.customers || []).length) + ' clientes · ' + ((d.stockLog || []).length) + ' entradas de estoque';
const isEmptyLocal = () => !S.sales.length && !S.stockLog.length && !S.customers.length;
let conflictOff = false, CONF = null;
async function pushLocal() {
  if (!S.updatedAt) { S.updatedAt = new Date().toISOString(); persistLocal(); }
  const stamp = S.updatedAt;
  await remotePut();
  META.base = stamp;
  if (S.updatedAt === stamp) META.dirty = false; else scheduleSync();
  META.lastSync = new Date().toISOString(); metaSave();
}
function applyRemote(rem) {
  S = migrate(Object.assign(defaults(), rem.data));
  S.updatedAt = rem.updated_at; persistLocal();
  META.base = rem.updated_at; META.dirty = false; META.lastSync = new Date().toISOString(); metaSave();
  render();
}

// Regras de segurança: este aparelho só envia quando a nuvem ainda é a que ele conhece;
// só baixa sozinho quando ele não tem nada novo; em qualquer outro caso PERGUNTA.
async function syncNow(manual) {
  if (!cloudOn || !META.uid || syncing) return;
  if (!manual && !autoOn()) return;
  if (!manual && conflictOff) return;
  if (navigator.onLine === false) { if (manual) toast('Sem internet'); updatePill(); return; }
  syncing = true;
  try {
    const rem = await remoteGet();
    if (!rem) { if (!isEmptyLocal() || META.dirty) await pushLocal(); }
    else if (sameTime(rem.updated_at, META.base)) { if (META.dirty) await pushLocal(); }
    else if (!META.dirty && (META.base || isEmptyLocal())) applyRemote(rem);
    else if (isEmptyLocal()) applyRemote(rem);
    else { conflictSheet(rem); syncing = false; updatePill(); return; }
    syncErr = ''; if (manual) toast('☁️ Tudo sincronizado');
  } catch (e) {
    syncErr = (e && e.message) || 'Falha ao sincronizar'; if (manual) toast(syncErr);
  } finally {
    syncing = false; updatePill(); if (view === 'nuvem') render();
  }
}
async function cloudPush() {
  if (!cloudOn || !META.uid) return;
  try {
    const rem = await remoteGet();
    if (rem && !sameTime(rem.updated_at, META.base) && !confirm('A nuvem tem dados diferentes (' + dataInfo(rem.data) + ').\n\nSalvar este aparelho vai SUBSTITUIR o que está na nuvem. Continuar?')) return;
    await pushLocal(); syncErr = ''; toast('☁️ Backup salvo na nuvem');
  } catch (e) { syncErr = e.message; toast(syncErr); }
  updatePill(); if (view === 'nuvem') render();
}
async function cloudPull() {
  if (!cloudOn || !META.uid) return;
  try {
    const rem = await remoteGet();
    if (!rem) return toast('Ainda não tem nada salvo na nuvem');
    if (!confirm('Restaurar da nuvem (' + dataInfo(rem.data) + ')?\n\nIsso SUBSTITUI os dados deste aparelho.')) return;
    applyRemote(rem); syncErr = ''; toast('⬇️ Dados restaurados da nuvem');
  } catch (e) { syncErr = e.message; toast(syncErr); }
  updatePill(); if (view === 'nuvem') render();
}

}

function updateCheckout() {
  const sub = cartSubtotal(), disc = Math.min(num($('#fdisc') && $('#fdisc').value), sub);
  const total = Math.max(0, sub - disc);
  const own = fs.status === 'own';
  if ($('#ftotal')) $('#ftotal').textContent = own ? brl(cartCost()) : brl(total);
  if ($('#flabel')) $('#flabel').textContent = own ? 'Custo (sem lucro)' : 'Total';
  if ($('#fconfirm')) $('#fconfirm').textContent = own ? 'Registrar retirada' : 'Fechar compra';
  if ($('#fnamel')) $('#fnamel').hidden = own;
  if ($('#fdisc')) $('#fdisc').closest('label').hidden = own;
  if ($('#newc') && $('#fname')) { const v = $('#fname').value.trim().toLowerCase(); $('#newc').hidden = own || !v || S.customers.some(c => c.name.toLowerCase() === v); }
  const cash = fs.status === 'paid' && fs.method === 'Dinheiro';
  if ($('#cashrow')) $('#cashrow').hidden = !cash;
  if ($('#smethod')) $('#smethod').style.display = fs.status === 'paid' ? '' : 'none';
  const rec = num($('#frec') && $('#frec').value);
  if ($('#ftroco')) $('#ftroco').textContent = (cash && rec > 0) ? (rec >= total ? 'Troco: ' + brl(rec - total) : 'Faltam ' + brl(total - rec)) : '';
  return total;
}
function confirmSale() {
  const lines = cartLines(), sub = r2(lines.reduce((a, l) => a + l.total, 0)); if (!sub) return;
  const disc = Math.min(num($('#fdisc').value), sub), total = r2(Math.max(0, sub - disc));
  const nameIn = $('#fname').value.trim();
  if (fs.status === 'pending' && !nameIn) return toast('Venda não paga precisa do nome do cliente');
  for (const l of lines) if (l.p.stock < l.q && !confirm(`Estoque de ${l.p.name} é ${l.p.stock}. Vender ${l.q} mesmo assim?`)) return;
  if (fs.status === 'own') {
    const d0 = $('#fdate').value || dkey(new Date()), w0 = d0 === dkey(new Date()) ? new Date() : new Date(d0 + 'T12:00:00');
    const it0 = lines.map(l => ({ pid: l.p.id, name: l.p.name, qty: l.q, total: 0, cost: r2(l.q * (l.p.cost || 0)) }));
    it0.forEach(i => { prod(i.pid).stock -= i.qty; });
    const c0 = r2(it0.reduce((a, i) => a + i.cost, 0));
    S.sales.push({ id: uid(), date: w0.toISOString(), items: it0, subtotal: 0, discount: 0, total: 0, cost: c0, customerId: null, customerName: '', status: 'paid', method: 'Pra mim', own: true, desc: ($('#fdesc').value || '').trim(), paidAt: w0.toISOString() });
    save(); cart = {}; closeSheet(); render(); toast('🙋🏻‍♀️ Retirada registrada (custo ' + brl(c0) + ')'); return;
  }
  let cid = null, cname = '';

function inPeriod(iso) {
  if (period === 'all') return true;
  const d = new Date(iso), now = new Date();
  if (period === 'month') return d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth();
  const start = new Date(now.getFullYear(), now.getMonth(), now.getDate() - (+period - 1));
  return d >= start;
}
function buckets(sales) {
  const out = [], now = new Date();
  if (period === 'all') {
    const first = sales.length ? new Date(sales.map(s => s.date).sort()[0]) : now;
    let y = first.getFullYear(), m = first.getMonth(), n = 0;
    while ((y < now.getFullYear() || (y === now.getFullYear() && m <= now.getMonth())) && n++ < 36) {
      out.push({ key: y + '-' + pad(m + 1), label: pad(m + 1) + '/' + String(y).slice(2), rev: 0, profit: 0 });
      if (++m > 11) { m = 0; y++; }
    }
    return { out, keyOf: iso => dkey(iso).slice(0, 7) };
  }
  const days = period === 'month' ? now.getDate() : +period;
  for (let i = days - 1; i >= 0; i--) {
    const d = new Date(now.getFullYear(), now.getMonth(), now.getDate() - i);
    out.push({ key: dkey(d), label: String(d.getDate()), rev: 0, profit: 0 });
  }
  return { out, keyOf: iso => dkey(iso) };
}
function chartSVG(bk) {
  const W = 340, H = 170, top = 18, bot = 22, n = bk.length, slot = W / n, bw = Math.max(3, slot * .72);
  const max = Math.max(1, ...bk.map(b => b.rev)), h = H - top - bot, step = Math.ceil(n / 8);
  let g = `<text x="0" y="11" fill="#c9a89a" font-size="10">${brl(max)}</text><line x1="0" x2="${W}" y1="${H - bot}" y2="${H - bot}" stroke="#5b3329"/>`;
  bk.forEach((b, i) => {
    const x = i * slot + (slot - bw) / 2, rh = b.rev / max * h, ph = Math.max(0, b.profit) / max * h;
    if (rh > 0) g += `<rect x="${x.toFixed(1)}" y="${(H - bot - rh).toFixed(1)}" width="${bw.toFixed(1)}" height="${rh.toFixed(1)}" rx="3" fill="#f2c14e"/>`;
    if (ph > 0) g += `<rect x="${(x + bw * .2).toFixed(1)}" y="${(H - bot - ph).toFixed(1)}" width="${(bw * .6).toFixed(1)}" height="${ph.toFixed(1)}" rx="2" fill="#d9246f"/>`;
    if (i % step === 0 || i === n - 1) g += `<text x="${(i * slot + slot / 2).toFixed(1)}" y="${H - 6}" fill="#c9a89a" font-size="10" text-anchor="middle">${b.label}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Gráfico do que você vendeu e do lucro">${g}</svg>`;
}
let lmode = 'caixa';
function vLucro() {

/* arrastar para reordenar o menu "Mais" (segurar ~0,4s e arrastar) */
(function () {
  let el = null, timer = 0, drag = false, sy = 0, grab = 0, py = 0, swallow = 0, raf = 0;
  const list = () => document.getElementById('menulist');
  const center = n => { const r = n.getBoundingClientRect(); return r.top + r.height / 2; };
  const place = () => {
    el.style.transform = 'none';
    let prev = el.previousElementSibling, next = el.nextElementSibling;
    while (prev && py - grab < center(prev)) { el.parentNode.insertBefore(el, prev); prev = el.previousElementSibling; }
    while (next && py - grab > center(next)) { el.parentNode.insertBefore(next, el); next = el.nextElementSibling; }
    el.style.transform = 'translateY(' + (py - grab - center(el)) + 'px) scale(1.03)';
  };
  const tick = () => { if (!drag) return; if (py < 110) window.scrollBy(0, -9); else if (py > innerHeight - 130) window.scrollBy(0, 9); place(); raf = requestAnimationFrame(tick); };
  const stop = commit => {
    clearTimeout(timer); cancelAnimationFrame(raf);
    if (drag && el) {
      el.classList.remove('dragging'); el.style.transform = '';
      if (commit) { S.menuOrder = [...list().children].map(c => c.dataset.mk).filter(Boolean); save(); }
      swallow = Date.now() + 400;
    }
    drag = false; el = null;
  };
  document.addEventListener('pointerdown', e => {
    const t = e.target.closest && e.target.closest('#menulist .menu'); if (!t || (e.pointerType === 'mouse' && e.button)) return;
    el = t; sy = py = e.clientY; drag = false; clearTimeout(timer);
    timer = setTimeout(() => {
      if (!el) return; drag = true; grab = sy - center(el); el.classList.add('dragging'); try { navigator.vibrate && navigator.vibrate(15); } catch (x) {}
      raf = requestAnimationFrame(tick);
    }, 400);
  });
  document.addEventListener('pointermove', e => {
    if (!el) return; py = e.clientY;
    if (!drag && Math.abs(py - sy) > 9) { clearTimeout(timer); el = null; }
  });
  ['pointerup', 'pointercancel'].forEach(n => document.addEventListener(n, () => { if (el) stop(n === 'pointerup'); }));
  document.addEventListener('touchmove', e => { if (drag) e.preventDefault(); }, { passive: false });
  document.addEventListener('contextmenu', e => { if (e.target.closest && e.target.closest('#menulist')) e.preventDefault(); });
  document.addEventListener('click', e => { if (Date.now() < swallow) { e.stopImmediatePropagation(); e.preventDefault(); } }, true);
})();

    <p class="muted">${stat}${META.lastSync ? '<br>Última vez que salvou/baixou: ' + fmtDate(META.lastSync) : ''}</p></div>
    <div class="card"><h3>Backup automático</h3>
    <div class="seg"><button class="${a === true ? 'on' : ''}" data-a="autoset" data-v="on">Ligado</button><button class="${a === false ? 'on' : ''}" data-a="autoset" data-v="off">Desligado</button></div>
    <p class="muted" style="margin-top:10px">${a === true ? 'Tudo que você lança é enviado sozinho. Se este aparelho e a nuvem ficarem diferentes, o app pergunta qual manter antes de trocar qualquer coisa.' : a === false ? 'Nada é enviado nem baixado sozinho. Use os botões abaixo quando quiser.' : 'Escolha acima como quer o backup.'}</p>
    <button class="btn primary wide" data-a="cloudpush">⬆️ Salvar backup agora</button>
    <button class="btn wide" data-a="cloudpull">⬇️ Restaurar da nuvem</button>
    ${a === true ? '<button class="btn wide" data-a="syncnow">Sincronizar agora</button>' : ''}
    <button class="btn danger wide" data-a="logout">Sair</button></div>`;
  }
  return sub('', 'Nuvem') + body + `<div class="card"><h3>Como funciona</h3><p class="muted">O app sempre guarda tudo no próprio aparelho e funciona sem internet. O banco de dados é uma cópia na nuvem: com o backup automático ligado ela é atualizada sozinha; desligado, só quando você tocar em “Salvar backup agora”. Ao entrar num aparelho novo, o app nunca apaga nada sem perguntar.</p></div>`;
}
function vBackup() {
  return sub('', 'Backup') + xlsCard() + `<div class="card"><h3>💾 Backup completo</h3><p>Uma cópia extra em arquivo, para guardar no iCloud, WhatsApp ou e-mail. Vale fazer de vez em quando, mesmo com o banco de dados ligado.</p>
  <p class="muted">Último backup: ${S.lastBackup ? fmtDate(S.lastBackup) : 'nunca'}</p>
  <button class="btn primary wide" data-a="export">Exportar backup</button>
  <button class="btn wide" data-a="import">Restaurar de um backup</button></div>
  <div class="card"><h3>Zona de perigo</h3><p class="muted">Apaga vendas, clientes e entradas e volta os produtos ao padrão${cloudOn && META.uid ? ' (e isso também vai para a nuvem)' : ''}.</p>
  <button class="btn danger wide" data-a="reset">Apagar todos os dados</button></div>`;
}
async function exportBackup() {
  const name = 'ribas-backup-' + dkey(new Date()) + '.json';
  const blob = new Blob([JSON.stringify(S, null, 1)], { type: 'application/json' });
  const mark = () => { S.lastBackup = new Date().toISOString(); save(); render(); };
  try {
    const file = new File([blob], name, { type: 'application/json' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: 'Backup Ribas Gourmet' }); return mark(); }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); mark(); toast('Backup baixado');
}

/* ============ ações ============ */
const actions = {
  toggle: d => { col[d.k] = !col[d.k]; render(); },
  tab: d => { if (view === 'nota') noteEnd(); view = d.v; window.scrollTo(0, 0); render(); },
  close: () => closeSheet(),
  newprod: () => prodSheet(''), editprod: d => prodSheet(d.id),
  delprod: d => { if (confirm('Excluir este produto? As vendas antigas continuam no histórico.')) { S.products = S.products.filter(p => p.id !== d.id); delete cart[d.id]; save(); closeSheet(); render(); } },
  stockadd: d => stockSheet(d.id),
  stockq: d => { $('#sq').value = d.q; },
  stockapply: d => {
    const q = int($('#sq').value); if (!q) return toast('Digite a quantidade');
    const p = prod(fs.id), delta = q * +d.s;
    p.stock += delta; logStock(p, delta, $('#sdate').value); save(); closeSheet(); render();
    toast(delta > 0 ? '📦 Entrada lançada: +' + delta : 'Retirado: ' + delta);
  },
  stockset: () => {
    const v = $('#sq').value; if (v === '') return toast('Digite o estoque certo no campo');
    const p = prod(fs.id), delta = int(v) - p.stock; if (!delta) return closeSheet();
    p.stock += delta; logStock(p, delta, $('#sdate').value); save(); closeSheet(); render();
  },
  delentry: d => {
    const e = S.stockLog.find(x => x.id === d.id); if (!e || !confirm('Desfazer este lançamento? O estoque será ajustado.')) return;
    const p = prod(e.pid); if (p) p.stock -= e.qty;
    S.stockLog = S.stockLog.filter(x => x.id !== d.id); save(); render();
  },
  cartdelta: d => { const q = Math.max(0, (cart[d.id] || 0) + +d.d); if (q) cart[d.id] = q; else delete cart[d.id]; render(); },
  clearcart: () => { cart = {}; render(); },
  checkout: () => checkout(),
  setstatus: d => { fs.status = d.v; document.querySelectorAll('#sstatus button').forEach(b => b.classList.toggle('on', b.dataset.v === d.v)); updateCheckout(); },
  setmethod: d => { fs.method = d.v; document.querySelectorAll('#smethod button').forEach(b => b.classList.toggle('on', b.dataset.v === d.v)); updateCheckout(); },
  confirmsale: () => confirmSale(),
  paysale: d => paySheet(d.ids.split(',')),
  dopay: d => { const now = new Date().toISOString(); S.sales.forEach(s => { if (payIds.includes(s.id)) { s.status = 'paid'; s.method = d.m; s.paidAt = now; } }); save(); closeSheet(); render(); toast('💰 Pagamento acertado!'); },
  period: d => { period = d.v; render(); },
  menureset: () => { delete S.menuOrder; save(); render(); },
  newinv: () => invSheet(''), editinv: d => invSheet(d.id),
  delinv: d => { if (confirm('Excluir este investimento?')) { S.invests = S.invests.filter(v => v.id !== d.id); save(); closeSheet(); render(); } },
  newcust: () => custSheet(''), editcust: d => custSheet(d.id),
  delcust: d => { if (confirm('Excluir este cliente? As vendas dele continuam no histórico.')) { S.customers = S.customers.filter(c => c.id !== d.id); save(); closeSheet(); render(); } },
  sale: d => saleSheet(d.id),
  delsale: d => {
    if (!confirm('Excluir esta venda e devolver os itens ao estoque?')) return;
    const s = S.sales.find(x => x.id === d.id); s.items.forEach(i => { const p = prod(i.pid); if (p) p.stock += i.qty; });
    S.sales = S.sales.filter(x => x.id !== d.id); save(); closeSheet(); render();
  },
  ck: d => { calcKey(d.k); render(); },
  rdays: d => { rdays = +d.v; render(); },
  async copyrepor() {
    const t = reporText();
    try { await navigator.clipboard.writeText(t); toast('📋 Lista copiada!'); return; } catch (e) {}
    const ta = document.createElement('textarea'); ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta);
    ta.focus(); ta.select(); try { ta.setSelectionRange(0, 99999); document.execCommand('copy'); toast('📋 Lista copiada!'); } catch (e2) { toast('Não consegui copiar'); } ta.remove();
  },
  async sharerepor() { try { await navigator.share({ title: 'Lista para repor', text: reporText() }); } catch (e) {} },
  xp: d => { xp = d.v; render(); },
  dp: d => { dp = d.v; render(); },
  fp: d => { fp = d.v; render(); },
  opensale: d => saleSheet(d.id),
  lmode: d => { lmode = d.v; render(); },
  newnote: () => { const n = { id: uid(), text: '', at: new Date().toISOString(), upd: new Date().toISOString(), pin: false }; S.notes.push(n); curNote = n.id; view = 'nota'; window.scrollTo(0, 0); render(); setTimeout(() => { const t = $('#ntext'); t && t.focus(); }, 60); },
  opennote: d => { curNote = d.id; view = 'nota'; window.scrollTo(0, 0); render(); },
  noteback: () => { noteEnd(); view = 'notas'; render(); },
  notepin: () => { const n = S.notes.find(x => x.id === curNote); if (n) { n.pin = !n.pin; save(); render(); } },
  notedel: () => { if (confirm('Excluir esta nota?')) { S.notes = S.notes.filter(x => x.id !== curNote); curNote = null; save(); view = 'notas'; render(); } },
  xlsp: d => { xlsP = d.v; render(); },
  xlsx: () => exportXlsx(),
  cancelsale: d => {
    if (!confirm('Cancelar esta compra? Os itens voltam para o estoque.')) return;
    const x = S.sales.find(v => v.id === d.id); if (!x) return;
    x.items.forEach(i => { const q = prod(i.pid); if (q) q.stock += i.qty; });
    S.sales = S.sales.filter(v => v.id !== d.id); save(); render(); toast('Compra cancelada');
  },
  syncnow: () => syncNow(true),
  autoset: d => {
    META.auto = d.v === 'on'; metaSave(); clearTimeout(syncTimer); closeSheet(); updatePill(); render();
    toast(META.auto ? '☁️ Backup automático ligado' : 'Backup manual (automático desligado)');
    if (META.auto) syncNow(true);
  },
  cloudpush: () => cloudPush(),
  cloudpull: () => cloudPull(),
  usecloud: () => { if (CONF && confirm('Os dados deste aparelho serão substituídos pelos da nuvem. Continuar?')) { applyRemote(CONF); closeSheet(); toast('⬇️ Usando os dados da nuvem'); } },
  async uselocal() {
    if (!CONF || !confirm('Os dados da nuvem serão SUBSTITUÍDOS pelos deste aparelho (' + dataInfo(CONF.data) + ' vão ser apagados da nuvem). Continuar?')) return;
    try { await pushLocal(); closeSheet(); updatePill(); render(); toast('⬆️ Nuvem atualizada com os dados deste aparelho'); } catch (e) { toast(e.message); }
  },
  conflictlater: () => { conflictOff = true; closeSheet(); toast('Nada foi alterado. Decida em Mais → Banco de dados.'); },
  resetcfg: () => { META.cfgUrl = META.cfgKey = ''; metaSave(); applyCfg(); render(); },
  async signup() {
    const email = ($('input[name=email]').value || '').trim(), pass = $('input[name=pass]').value || '';
    if (!email || pass.length < 6) return toast('Digite e-mail e uma senha de 6+ caracteres');
    try {
      if (await signup(email, pass)) { toast('☁️ Conta criada!'); syncErr = ''; afterLogin(); render(); }
      else toast('Conta criada! Confirme pelo e-mail e depois toque em Entrar.');
    } catch (e) { toast(e.message || 'Falha ao criar a conta'); }
  },
  logout: () => { if (confirm('Sair da nuvem? Os dados continuam neste celular.')) { META.access = META.refresh = META.uid = META.email = null; metaSave(); render(); } },
  export: () => exportBackup(),
  import: () => $('#imp').click(),
  reset: () => { if (confirm('Apagar TODOS os dados?' + (autoOn() ? ' O backup automático está ligado: a nuvem também será apagada.' : '') + ' Isso não pode ser desfeito.') && confirm('Tem certeza mesmo? Faça um backup antes se tiver dúvida.')) { S = defaults(); cart = {}; save(); render(); toast('Dados apagados'); } }
};
const forms = {
  prod(f, d) {
  const line = (f.line || '').trim(), flavor = (f.flavor || '').trim();
  const o = { line, flavor, name: (line + ' ' + flavor).trim(), price: num(f.price), cost: num(f.cost), min: int(f.min), promoQty: int(f.promoQty), promoPrice: num(f.promoPrice), promoGroup: (f.promoGroup || '').trim() };
  if (d.id) Object.assign(prod(d.id), o);
  else { const p = Object.assign({ id: uid(), stock: 0 }, o); S.products.push(p); const q = int(f.stock); if (q > 0) { p.stock = q; logStock(p, q); } }
  save(); closeSheet(); render();
},
  inv(f, d) {
    const o = { name: f.name.trim(), value: r2(num(f.value)), date: f.date || dkey(new Date()), note: (f.note || '').trim() };
    if (!o.name || !(o.value > 0)) { toast('Preencha o item e o valor'); return; }
    if (d.id) Object.assign(S.invests.find(v => v.id === d.id), o); else S.invests.push(Object.assign({ id: uid(), at: new Date().toISOString() }, o));
    save(); closeSheet(); render();
  },
  cust(f, d) {
    if (d.id) Object.assign(cust(d.id), { name: f.name.trim(), phone: f.phone.trim() }); else S.customers.push({ id: uid(), name: f.name.trim(), phone: f.phone.trim() });
    save(); closeSheet(); render();
  },
  editsale(f, d) {
    const x = S.sales.find(v => v.id === d.id); if (!x) return;
    if (f.date && f.date !== dkey(x.date)) x.date = new Date(f.date + 'T12:00:00').toISOString();
    x.desc = (f.desc || '').trim();
    if (!x.own) {
      const nm = (f.cname || '').trim();
      if (f.pay === 'Pendente' && !nm) return toast('Venda pendente precisa do nome do cliente');
      if (nm) {
        let c = S.customers.find(v => v.name.toLowerCase() === nm.toLowerCase());
        if (!c) { c = { id: uid(), name: nm, phone: '' }; S.customers.push(c); }
        x.customerId = c.id; x.customerName = c.name;
      } else { x.customerId = null; x.customerName = ''; }
      if (f.pay === 'Pendente') { x.status = 'pending'; x.method = ''; x.paidAt = null; }
      else { if (x.status !== 'paid') x.paidAt = new Date().toISOString(); x.status = 'paid'; x.method = f.pay; }
    } else x.paidAt = x.date;
    save(); closeSheet(); render(); toast('✅ Alterado!');
  },
  setup(f) {
    const url = f.url.trim();
    if (!/^https:\/\/.+/i.test(url)) return toast('A URL precisa começar com https://');
    META.cfgUrl = url; META.cfgKey = f.key.trim(); metaSave(); applyCfg(); updatePill(); render(); toast('Agora entre ou crie sua conta');
  },
  async login(f) {
    try { await login(f.email.trim(), f.pass); toast('☁️ Conectada!'); syncErr = ''; afterLogin(); render(); }
    catch (e) { toast(e.message || 'Falha no login'); }
  }
};

document.addEventListener('click', e => {
  if (e.target.id === 'ov') return closeSheet();
  const t = e.target.closest('[data-a]'); if (!t) return;
  const fn = actions[t.dataset.a]; if (fn) fn(t.dataset, t);
});
document.addEventListener('submit', e => {
  const f = e.target.closest('form[data-form]'); if (!f) return;
  e.preventDefault(); forms[f.dataset.form](Object.fromEntries(new FormData(f)), f.dataset);
});
document.addEventListener('input', e => {
  const id = e.target.id;
  if (id === 'fdisc' || id === 'frec') updateCheckout();
  if (id === 'fname') { const v = e.target.value.trim().toLowerCase(); $('#newc').hidden = !v || S.customers.some(c => c.name.toLowerCase() === v); }
  if (id === 'ntext') {
    const n = S.notes.find(x => x.id === curNote); if (n) { n.text = e.target.value; n.upd = new Date().toISOString(); clearTimeout(noteTimer); noteTimer = setTimeout(save, 500); }
  }
  if (id === 'nsearch') { nq = e.target.value; const pos = e.target.selectionStart; render(); const i = $('#nsearch'); if (i) { i.focus(); try { i.setSelectionRange(pos, pos); } catch (x) {} } }
  if (id === 'fsearch') { csearch = e.target.value; applyFilter(); }
  if (e.target.dataset && e.target.dataset.pf) {
    const card = e.target.closest('[data-card]'), p = prod(card.dataset.card);
    p.cost = num(card.querySelector('[data-pf=cost]').value); p.price = num(card.querySelector('[data-pf=price]').value);
    $('#pl-' + p.id).textContent = lucroTxt(p.cost, p.price); save();
  }
});
$('#imp').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      if (!d || !Array.isArray(d.products) || !Array.isArray(d.sales)) throw 0;
      if (!confirm('Substituir os dados atuais pelo backup (' + d.sales.length + ' vendas)?')) return;
      S = migrate(Object.assign(defaults(), d)); save(); render(); toast('Backup restaurado!');
    } catch (err) { toast('Arquivo de backup inválido'); }
  };
  r.readAsText(f); e.target.value = '';
});
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') syncNow(); });
window.addEventListener('online', () => syncNow());
window.addEventListener('offline', updatePill);

/* ============ render ============ */
function render() {
  const V = { estoque: vEstoque, vender: vVender, pend: vPend, lucro: vLucro, mais: vMais, precos: vPrecos, entradas: vEntradas, extrato: vExtrato, repor: vRepor, fin: vFin, dados: vDados, notas: vNotas, nota: vNota, invest: vInvest, clientes: vClientes, hist: vHist, calc: vCalc, nuvem: vNuvem, backup: vBackup };
  $('#app').innerHTML = V[view]();
  const nav = ['notas', 'nota', 'dados', 'invest', 'repor', 'precos', 'entradas', 'extrato', 'clientes', 'hist', 'calc', 'nuvem', 'backup'].includes(view) ? 'mais' : view;
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.v === nav));
  const n = S.sales.filter(s => s.status === 'pending').length, bd = $('#pbadge');
  bd.hidden = !n; bd.textContent = n;
  renderCartBar();
  if (view === 'vender') applyFilter();
}
render();
syncNow();
if (META.uid && META.auto === undefined) setTimeout(autoChoiceSheet, 600);
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
